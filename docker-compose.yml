# Local development stack.
#
#   docker compose up -d                  # Postgres + MinIO; run the server with `go run ./cmd/server`
#   docker compose --profile full up -d   # ...and the containerised server too
#
# Credentials here are for local development only.

name: labrat

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lde
      POSTGRES_PASSWORD: lde
      POSTGRES_DB: lde
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lde -d lde"]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible object storage for Parquet archives.
  minio:
    image: minio/minio:latest # pin a RELEASE tag for anything beyond local dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lde
      MINIO_ROOT_PASSWORD: lde-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  labrat:
    profiles: ["full"]
    build: .
    environment:
      LDE_DATABASE_URL: postgres://lde:lde@postgres:5432/lde?sslmode=disable
      LDE_S3_ENDPOINT: http://minio:9000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
