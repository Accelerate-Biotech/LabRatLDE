# Local development stack.
#
#   docker compose up -d                  # Postgres; run the server with `go run ./cmd/server`
#   docker compose --profile full up -d   # ...and the containerised server too
#   docker compose --profile idp up -d    # a local Keycloak for LDE_ENV=prod (tools/keycloak/README.md)
#
# Credentials here are for local development only.

name: labrat

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lde
      POSTGRES_PASSWORD: lde
      POSTGRES_DB: lde
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lde -d lde"]
      interval: 2s
      timeout: 3s
      retries: 30

  labrat:
    profiles: ["full"]
    build: .
    environment:
      LDE_DATABASE_URL: postgres://lde:lde@postgres:5432/lde?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Test identity provider. Not persisted: every start re-imports the realm.
  keycloak:
    profiles: ["idp"]
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm", "--http-port", "8081"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8081"
    volumes:
      - ./tools/keycloak:/opt/keycloak/data/import:ro

volumes:
  pgdata:
